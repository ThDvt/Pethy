# Kiểm thử tự động bằng trình duyệt thật (Playwright).
#  - Job "giao-dien-voi-supabase-thu": dựng một Supabase CỤC BỘ tạm thời ngay trong GitHub Actions (Docker, miễn phí, không đụng hệ thống thật,
#    không cần tạo project hay thêm secrets), chạy db/01 đến 04, rồi chạy giao diện trong repo nối vào đó. Mỗi lần chạy là một cơ sở dữ liệu mới.
#  - Job "ban-dang-chay": chỉ đọc, kiểm tra bản đã triển khai (trang tải được, tiêu đề bảo mật, dữ liệu công khai).
name: Kiểm thử tự động

on:
  pull_request:
    paths: ['web/**', 'e2e/**', 'db/**', '.github/workflows/kiem-thu-e2e.yml']
  schedule:
    - cron: "37 21 * * *"   # 04:37 giờ Việt Nam mỗi ngày
  workflow_dispatch:

permissions:
  contents: read

jobs:
  giao-dien-voi-supabase-thu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Dựng Supabase cục bộ
        run: |
          supabase init
          # Giới hạn đăng nhập mặc định (30 lần mỗi 5 phút) quá thấp cho bộ kiểm thử, nơi mọi lần đăng nhập đến từ một địa chỉ.
          sed -i 's/^sign_in_sign_ups *=.*/sign_in_sign_ups = 1000/; s/^token_refresh *=.*/token_refresh = 1000/' supabase/config.toml
          supabase start
          supabase status -o env > /tmp/sb.env
      - name: Cài cơ sở dữ liệu (db/01 đến 04) và tạo admin thử
        run: |
          set -euo pipefail
          . /tmp/sb.env
          for f in 01_schema 02_logic 03_rls 04_storage; do psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "db/$f.sql" > /dev/null; done
          # Supabase cục bộ trả địa chỉ ảnh dạng http://127.0.0.1, còn ràng buộc thật chỉ nhận https:// (đúng cho hệ thống thật). Chỉ nới trong CSDL thử này.
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q <<'SQL'
          DO $$ DECLARE c text; BEGIN
            FOR c IN SELECT conname FROM pg_constraint WHERE conrelid = 'public.bai_viet'::regclass AND contype = 'c' AND pg_get_constraintdef(oid) LIKE '%anh_bia%' LOOP
              EXECUTE format('ALTER TABLE public.bai_viet DROP CONSTRAINT %I', c);
            END LOOP;
            ALTER TABLE public.bai_viet ADD CONSTRAINT bai_viet_anh_bia_thu CHECK (anh_bia IS NULL OR (anh_bia ~ '^https?://' AND length(anh_bia) <= 500));
          END $$;
          SQL
          ADMIN_EMAIL="admin-thu@example.com"; ADMIN_PASS="$(openssl rand -hex 12)A1"; TEST_PASS="$(openssl rand -hex 12)A1"
          echo "::add-mask::$ADMIN_PASS"; echo "::add-mask::$TEST_PASS"
          curl -sSf -X POST "$API_URL/auth/v1/admin/users" -H "apikey: $SERVICE_ROLE_KEY" -H "Authorization: Bearer $SERVICE_ROLE_KEY" -H "Content-Type: application/json" \
            -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASS\",\"email_confirm\":true}" > /dev/null
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "UPDATE tai_khoan SET vai_tro = 'admin' WHERE id = (SELECT id FROM auth.users WHERE email = '$ADMIN_EMAIL');"
          { echo "E2E_SUPABASE_URL=$API_URL"; echo "E2E_SUPABASE_ANON_KEY=$ANON_KEY"; echo "E2E_ADMIN_EMAIL=$ADMIN_EMAIL"; echo "E2E_ADMIN_PASSWORD=$ADMIN_PASS"; echo "E2E_MAT_KHAU=$TEST_PASS"; } >> "$GITHUB_ENV"
      - name: Cài thư viện và trình duyệt (Chrome, Firefox, WebKit gần với Safari)
        working-directory: e2e
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium firefox webkit
      - name: Chạy kiểm thử
        working-directory: e2e
        run: npx playwright test
      - name: Lưu báo cáo và ảnh chụp khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: bao-cao-giao-dien, path: "e2e/playwright-report\ne2e/test-results", retention-days: 14 }
      - name: Nhật ký Supabase khi lỗi
        if: failure()
        run: docker ps --format '{{.Names}}' | grep -E 'auth|rest|storage' | head -3 | xargs -I{} sh -c 'echo "== {}"; docker logs --tail 40 {}' || true

  ban-dang-chay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Cài thư viện và trình duyệt
        working-directory: e2e
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Kiểm tra bản đang chạy (chỉ đọc)
        working-directory: e2e
        run: npx playwright test -c playwright.prod.config.js
      - name: Lưu báo cáo khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: bao-cao-ban-dang-chay, path: "e2e/playwright-report-prod\ne2e/test-results", retention-days: 14 }
