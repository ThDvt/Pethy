<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kho thuốc - Pethy</title><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/css/pethy.css">
<style>
.cot-chinh{flex:999 1 560px;min-width:0;padding:28px 36px}
.cot-phu{flex:1 1 300px;min-width:0;background:var(--nen-nhat);padding:28px 24px}
@media(max-width:760px){.cot-chinh,.cot-phu{padding:20px}}
.muc{margin-top:32px}
.muc h2{font-size:14px;margin:0;color:var(--xam);border-bottom:2px solid var(--muc);padding-bottom:8px}
.hang{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--vach)}
.hang .ten{flex:2 1 200px;min-width:0;font-weight:700}
.hang .sl{flex:0 0 100px;text-align:right;font:500 16px var(--so)}
.hang .lo{flex:1 1 200px;font-size:14px}
.nho{font-size:13px;color:var(--xam)}
.tt{display:inline-block;font-size:12px;font-weight:700;border:1px solid var(--muc);padding:1px 6px;border-radius:2px}
.tt.do{border-color:var(--loi);color:var(--loi)}
.con{padding-left:20px;background:var(--nen-nhat)}
.canh{padding:12px 0;border-bottom:1px solid var(--vach);font-size:14px}
dialog{border:1px solid var(--muc);border-radius:2px;padding:24px;max-width:480px;width:calc(100% - 40px)}
dialog::backdrop{background:rgba(20,22,26,.5)}
.luoi{display:flex;flex-wrap:wrap;gap:12px 16px}.luoi .truong{flex:1 1 180px;margin:0}
</style>
<link rel="stylesheet" href="/css/chuyen-dong.css"><script src="/js/chuyen-dong.js"></script>
</head>
<body>
<div class="bo-khu" id="khung-khu">
<script src="/js/thanh-ben-som.js"></script>
  <main class="cot-chinh">
    <div style="display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:baseline">
      <h1 style="margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em">Tồn kho</h1>
      <div style="display:flex;gap:20px;align-items:center">
        <button class="lien-ket" type="button" id="them-thuoc" style="font-weight:700">Thêm thuốc vào danh mục</button>
        <button class="nut chinh" type="button" id="nhap">Nhập hàng vào kho</button>
      </div>
    </div>
    <p class="mo-ta" style="margin:8px 0 0;color:var(--xam)">Thuốc mới chỉ cần thêm vào danh mục một lần. Mỗi khi có hàng về, bấm "Nhập hàng vào kho" để ghi số lô, hạn dùng và số lượng.</p>
    <p id="loi-chung" class="loi" role="alert" hidden></p>
    <section class="muc" aria-labelledby="h-ton"><h2 id="h-ton">Thuốc và vaccine</h2><div id="ds-ton"><p class="trang-thai-tai" role="status">Đang tải…</p></div></section>
    <section class="muc" aria-labelledby="h-ls"><h2 id="h-ls">Biến động gần đây</h2><div id="ds-ls"></div></section>
  </main>
  <aside class="cot-phu" aria-labelledby="h-cb">
    <h2 id="h-cb" style="font-size:14px;margin:0">Cảnh báo</h2>
    <div id="ds-cb" style="margin-top:14px"></div>
  </aside>
</div>
<dialog id="hop"><div id="hop-nd"></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/js/config.js"></script><script src="/js/app.js"></script><script src="/js/mau.js"></script><script src="/js/khu.js"></script>
<script src="/js/kho.js"></script>
</body>
</html>
