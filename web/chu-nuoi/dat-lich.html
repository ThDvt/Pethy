<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đặt lịch - Pethy</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/css/pethy.css">
<style>
.tg{display:flex;flex-wrap:wrap;gap:10px}
.tg button{min-width:84px;min-height:48px;border:1px solid var(--muc);background:#fff;border-radius:2px;font:500 16px var(--so);cursor:pointer;color:var(--muc)}
.tg button[aria-pressed=true]{background:var(--muc);color:#fff}
.chon{display:flex;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--vach);cursor:pointer;margin:0;font-size:16px;color:var(--muc)}
.chon:first-of-type{border-top:2px solid var(--muc)}
.chon input{flex:0 0 20px;width:20px;min-height:20px;margin:0}
.buoc-so{font:13px var(--so);letter-spacing:.04em;color:var(--xam);margin-bottom:8px}
.tomtat{border-top:2px solid var(--muc);margin:20px 0 28px}
.tomtat div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--vach)}
.tomtat div:first-child{border-top:0}
</style>
</head>
<body>
<div class="bo-khu" id="khung-khu">
  <main class="noi-dung-khu" style="max-width:640px">
    <div class="buoc-so" id="buoc-so"></div>
    <h1 id="tieu-de" style="margin:0 0 24px;font-size:28px;font-weight:800;letter-spacing:-.02em">Đặt lịch khám</h1>
    <div id="vung"><p class="trang-thai-tai">Đang tải…</p></div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/js/config.js"></script><script src="/js/app.js"></script><script src="/js/mau.js"></script><script src="/js/khu.js"></script>
<script src="/js/chu-nuoi.js"></script>
<script src="/js/dat-lich.js"></script>
</body></html>
